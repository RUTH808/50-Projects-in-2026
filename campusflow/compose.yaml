services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campusflow
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campusflow-local}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["campusflow-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow -d campusflow"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/campusflow
      DB_USER: campusflow
      DB_PASSWORD: ${DB_PASSWORD:-campusflow-local}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-CampusFlow-local-2026!}
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./frontend
    ports: ["127.0.0.1:3000:8080"]
    depends_on: [backend]
volumes:
  campusflow-db:
