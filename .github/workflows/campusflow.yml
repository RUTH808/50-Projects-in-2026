name: CampusFlow checks
on:
  push:
    paths: ['campusflow/**', '.github/workflows/campusflow.yml']
  pull_request:
    paths: ['campusflow/**', '.github/workflows/campusflow.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: campusflow_test
          POSTGRES_USER: campusflow
          POSTGRES_PASSWORD: campusflow-local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U campusflow -d campusflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: campusflow/backend/pom.xml
      - run: mvn -B verify
        working-directory: campusflow/backend
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/campusflow_test
          TEST_DB_USER: campusflow
          TEST_DB_PASSWORD: campusflow-local
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: campusflow/frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: campusflow/frontend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build && docker compose up -d
        working-directory: campusflow
      - run: curl --retry 30 --retry-all-errors --retry-delay 2 --retry-max-time 90 --connect-timeout 2 --max-time 5 --fail http://localhost:8080/actuator/health && python3 examples/demo.py
        working-directory: campusflow
      - if: always()
        run: docker compose logs && docker compose down
        working-directory: campusflow
